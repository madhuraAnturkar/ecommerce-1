server.port=6060
#DB config
spring.datasource.url=jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#default server port 8080
#server.port=9090
#Spring security - in memory user details
#spring.security.user.name=rama@gmail.com
#spring.security.user.password=rama#123
#spring.security.user.roles=ADMIN
#custom props for JWT(taken from env var)
# exp time 2 hours -> in msec 
jwt.exp.time=${JWT_EXPIRATION}
jwt.secret.key=${JWT_SECRET}
#while resolving services , use IP address instead of  internal host names , given by OS
eureka.instance.prefer-ip-address=true

