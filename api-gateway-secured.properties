server.port=8888
#register it as Eureka client , with Eureka server Url
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# do not include server stack trace
server.error.include-stacktrace=never

#Configure the routes for Inventory microservice  
spring.cloud.gateway.server.webflux.routes[0].id=id1
spring.cloud.gateway.server.webflux.routes[0].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/inventory/**
# StripPrefix removes the specified number of path segments from the beginning of the URL.
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2


#Configure the routes for Order microservice  
spring.cloud.gateway.server.webflux.routes[1].id=id2
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/orders/**
# StripPrefix removes the specified number of path segments from the beginning of the URL.
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2

#Configure the routes for User microservice  
spring.cloud.gateway.server.webflux.routes[2].id=id2
spring.cloud.gateway.server.webflux.routes[2].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/users/**
# StripPrefix removes the specified number of path segments from the beginning of the URL.
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=2


# exp time 2 hours -> in msec
jwt.exp.time=${JWT_EXPIRATION}
jwt.secret.key=${JWT_SECRET}


#required property for adding a binding with RabbitMq
spring.cloud.stream.default.group=api-gateway-secured



